<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>njuagent</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 2rem auto; max-width: 760px; padding: 0 1rem; }
  textarea { width: 100%; min-height: 6rem; font: inherit; padding: .5rem; box-sizing: border-box; }
  button { margin-top: .5rem; padding: .5rem 1.5rem; font: inherit; cursor: pointer; }
  pre { white-space: pre-wrap; word-break: break-word; background: #f5f5f5; border-radius: 6px; padding: 1rem; }
</style>
</head>
<body>
<h1>njuagent</h1>
<textarea id="input" placeholder="Describe a programming task for the agent..."></textarea>
<div><button id="run">Run</button></div>
<pre id="output">Ready.</pre>
<script>
  const input = document.getElementById("input");
  const output = document.getElementById("output");
  async function run() {
    const message = input.value.trim();
    if (!message) return;
    output.textContent = "running...";
    const resp = await fetch("/api/run", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ message }),
    });
    const data = await resp.json();
    output.textContent = data.result;
  }
  document.getElementById("run").addEventListener("click", run);
  input.addEventListener("keydown", (e) => { if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) run(); });
</script>
</body>
</html>
