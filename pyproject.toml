[project]
name = "njuagent"
version = "0.1.0"
description = "A self-built coding agent with a web UI (DeepSeek, tool-calling loop)"
requires-python = ">=3.10"
dependencies = [
    "fastapi",
    "uvicorn",
    "httpx",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
njuagent = "njuagent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
njuagent = ["server/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
