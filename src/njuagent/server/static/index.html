<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>njuagent</title>
<link rel="stylesheet" href="/static/vendor/highlight-vs2015.min.css">
<link rel="stylesheet" href="/static/vendor/codemirror/codemirror.css">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <div class="brand">njuagent</div>
  <div class="workdir" id="workdir" title="working directory"></div>
  <div class="toolbar">
    <label title="Prepend the plan-mode prefix to the next request">
      <input type="checkbox" id="planMode"> Plan
    </label>
    <label title="Skip command approval for this session">
      <input type="checkbox" id="autoApprove"> Auto-approve
    </label>
    <button id="settingsBtn" class="settings-btn" title="Settings">Settings</button>
    <span class="cost" id="cost"></span>
  </div>
</header>
<main>
  <aside class="pane tree-pane">
    <div class="sidebar-tabs">
      <button class="tab active" data-tab="files" title="Explorer">Files</button>
      <button class="tab" data-tab="git" title="Source control">Git</button>
      <button class="tab" data-tab="search" title="Search">Search</button>
    </div>
    <div id="filesView" class="sidebar-view">
      <div class="pane-title">Explorer</div>
      <div id="tree" class="tree"></div>
    </div>
    <div id="gitView" class="sidebar-view" hidden>
      <div class="pane-title">Source Control</div>
      <div id="gitContent" class="sidebar-content"></div>
    </div>
    <div id="searchView" class="sidebar-view" hidden>
      <div class="pane-title">Search</div>
      <div class="sidebar-content">
        <input id="searchQuery" class="search-input" placeholder="Search in workspace">
        <div class="search-opts" id="searchOpts">
          <button class="opt" data-opt="case" title="Case sensitive">Aa</button>
          <button class="opt" data-opt="word" title="Whole word">Word</button>
          <button class="opt" data-opt="regex" title="Regex">.*</button>
        </div>
        <button id="searchBtn" class="search-go">Search</button>
        <div id="searchResults" class="search-results"></div>
      </div>
    </div>
  </aside>
  <div class="resizer" data-side="left"></div>
  <section class="pane editor-pane">
    <div class="pane-title" id="editorTitle">Select a file</div>
    <textarea id="editor" spellcheck="false" disabled
      placeholder="Select a file in the tree to view or edit."></textarea>
    <div class="editor-bar">
      <span class="file-status" id="fileStatus"></span>
      <button id="saveBtn" disabled>Save</button>
    </div>
  </section>
  <div class="resizer" data-side="right"></div>
  <section class="pane chat-pane">
    <div class="pane-title">Conversation</div>
    <div id="messages" class="messages"></div>
    <div class="pending-box" id="pendingBox" hidden>
      <div class="pending-title">Modified files
        <span class="pending-actions">
          <button id="acceptAll">Keep all</button>
          <button id="rollbackAll">Rollback all</button>
        </span>
      </div>
      <div id="pendingList" class="pending-list"></div>
    </div>
    <form id="inputForm" class="input-row">
      <textarea id="input" placeholder="Describe a programming task..." rows="2"></textarea>
      <button id="sendBtn" type="submit">Send</button>
    </form>
    <div id="shellPanel" class="shell-panel" hidden>
      <div class="shell-head">
        <span>Shared Shell (Ctrl+`)</span>
        <span class="shell-actions">
          <button id="shellStop">Stop</button>
          <button id="shellClose">Close</button>
        </span>
      </div>
      <div id="shellOutput" class="shell-output"></div>
      <form id="shellForm" class="shell-input-row">
        <input id="shellInput" placeholder="Run a command (shared with the agent)" autocomplete="off" spellcheck="false">
        <button type="submit">Run</button>
      </form>
    </div>
  </section>
</main>

<div id="settingsModal" class="modal" hidden>
  <div class="modal-box">
    <h3>Settings</h3>
    <label class="modal-label" for="apiKeyInput">API Key</label>
    <input type="password" id="apiKeyInput" placeholder="DeepSeek API key" autocomplete="off">
    <div id="apiKeyStatus" class="modal-status"></div>
    <div class="modal-actions">
      <button id="apiKeySave" class="primary">Save Key</button>
      <button id="settingsClose">Close</button>
    </div>
  </div>
</div>

<script src="/static/vendor/highlight.min.js"></script>
<script src="/static/vendor/codemirror/codemirror.js"></script>
<script src="/static/vendor/codemirror/mode-python.js"></script>
<script src="/static/vendor/codemirror/mode-javascript.js"></script>
<script src="/static/vendor/codemirror/mode-xml.js"></script>
<script src="/static/vendor/codemirror/mode-css.js"></script>
<script src="/static/vendor/codemirror/mode-htmlmixed.js"></script>
<script src="/static/vendor/codemirror/mode-markdown.js"></script>
<script src="/static/vendor/codemirror/mode-clike.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
